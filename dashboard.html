<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="title">
        <h1>Welcome to Dashboard</h1>
        <div class="right">
            <span id="welcome"></span>
            <button id="logout" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <div class="contentAdd" id="contentAdd" >
        <div id="postLoading" style="display: none;">กำลังเพิ่มข้อมูล...</div>
        <h2 class="headPost" id="headPost">Add Post</h2>
        <input type="text" id="title" placeholder="หัวข้อ">
        <textarea id="body" placeholder="เนื้อหา"></textarea>
        <button id="addData" onclick="addPost()">เพิ่มข้อมูล</button>
    </div>
    <div id="contentData" class="contentData">
        <div id="loading"></div>
        <div id="posts"></div>
    </div>
    <script src="js/dashboard.js"></script>
</body>
</html>
